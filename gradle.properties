# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# AGP 9 built-in Kotlin: KSP attaches its generated sources via kotlin.sourceSets,
# which AGP disallows by default. AGP's own error message asks to opt out here.
android.disallowKotlinSourceSets=false
# The option above is still flagged experimental; AGP asks for this suppression.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Java toolchain: gradle-daemon-jvm.properties requires JDK 25. Point Gradle at the
# locally installed JDK 25 (Android Studio's JBR) and forbid auto-download, since
# api.foojay.io / github.com are not reachable from this network.
org.gradle.java.installations.paths=D:/Android/Android Studio/jbr,D:/dev-cache/jdks/ms-17.0.18
org.gradle.java.installations.auto-download=false